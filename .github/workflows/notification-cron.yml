name: notification-cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: notification-cron
  cancel-in-progress: false

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run notification cron (one-shot)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFICATION_CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
          NOTIFICATION_EMAIL_WEBHOOK: ${{ secrets.NOTIFICATION_EMAIL_WEBHOOK }}
          NOTIFICATION_ADMIN_EMAIL: ${{ secrets.NOTIFICATION_ADMIN_EMAIL }}
          NOTIFICATION_MAGAZZINIERE_EMAIL: ${{ secrets.NOTIFICATION_MAGAZZINIERE_EMAIL }}
          NOTIFICATION_PRESIDENTE_EMAIL: ${{ secrets.NOTIFICATION_PRESIDENTE_EMAIL }}
          NOTIFICATION_EMAIL_WEBHOOK_SHARED_SECRET: ${{ secrets.NOTIFICATION_EMAIL_WEBHOOK_SHARED_SECRET }}
          NOTIFICATION_EMAIL_WEBHOOK_TEST_MODE: ${{ secrets.NOTIFICATION_EMAIL_WEBHOOK_TEST_MODE }}
          USCITA_RIENTRO_TOLLERANZA_MINUTI: ${{ vars.USCITA_RIENTRO_TOLLERANZA_MINUTI }}
        run: deno run -A supabase/functions/notification-cron/index.ts --run-once
